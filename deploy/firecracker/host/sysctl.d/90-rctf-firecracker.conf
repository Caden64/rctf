# rCTF Firecracker instancer (network/routing track).
# Guests are routed, one point-to-point /30 per VM, with no bridge. The host
# must forward packets between the tap devices, the public interface and
# (for DNATed tcp/raw services) back out to clients.
net.ipv4.ip_forward = 1

# Additional kernel-side source validation. nftables remains the authoritative
# anti-spoof policy; rp_filter is only defence in depth.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
