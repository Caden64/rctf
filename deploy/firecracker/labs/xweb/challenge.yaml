# XWEB-500 Portal — stage 2 of the staged pair (SQLi / default creds).
# The enumeration stage is challenge-recon.yaml (fc-xweb-recon); both
# records share the same xweb-vuln image and each instance carries only its
# own platform flag. See deploy/firecracker/labs/xweb/README.md ("Staged
# records and flag placement").
#
# Static per-team flags come from the platform (flags/static); the guest
# consumes the flag only through MMDS. The placeholder below is not a real
# flag.
name: XWEB-500 Portal
category: web
description: >-
  The refrigeration supervisor portal for the site's XWEB-500 controller
  is reachable from the store network. Rumour says the commissioning crew
  never changed the factory access code, and the "remote assistance"
  diagnostics archive has never been audited. Recover the factory
  maintenance override code.
flags:
  - provider: flags/static
    config:
      flag: rctf{xweb-placeholder-set-by-the-platform}
instancerConfig:
  instancer: firecracker # key in the rctf.d `instancers` map
  challengeIntegrationId: fc-xweb # never change after launch
  timeoutMilliseconds: 1800000
  extendable: true
  config:
    image: xweb-vuln # <imagesDir>/xweb-vuln/{vmlinux,rootfs.ext4} on every host
    vcpus: 1
    memMiB: 256
    diskMiB: 512
    egress: false
    bootTimeoutSeconds: 60
    readiness: { kind: http, port: 8080, path: /, expectStatus: 200 }
    env:
      CHALLENGE: fc-xweb # drives flag placement: DB service-note row only
  expose:
    - kind: https
      hostPrefix: xweb
      containerName: app # must be 'app' for the Firecracker instancer
      containerPort: 8080
      shouldDisplay: true # required: endpoints are hidden from players unless this is true
      title: XWEB-500 Portal
