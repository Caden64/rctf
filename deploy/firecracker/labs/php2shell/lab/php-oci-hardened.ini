; PHP2Shell training-lab php.ini (HARDENED negative control), OFFICIAL image
; guest.
;
; Identical to php-oci.ini except memory_limit, which is raised above the
; 12 MiB OOM field the shipped chain sends (--huge-mb 12, the upstream
; default). The pre-RINIT OOM therefore never fires, stage 1 cannot leak, and
; the chain fails closed without a proof.
;
; log_errors must stay OFF here too (see php-oci.ini).
;
; HONEST LIMIT: this is a configuration control, not a memory-safety fix.
; The toolkit documents that the same 8.4.26 build is exploitable at 128M when
; the OOM body is raised to 140M (limit + 12M); its verification table records
; RCE at 8M and 128M. The runner's optional P2S_HARDENED_LIMIT_PROBE=1 probe
; measures that on the exact guest; RESULTS.md records the outcome. The
; control proves that the lab's 8M memory_limit is a load-bearing laboratory
; condition, nothing more.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 128M
post_max_size = 512M
upload_max_filesize = 512M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
