; PHP2Shell training-lab php.ini (VULNERABLE laboratory condition).
;
; Mirrors the toolkit's verified lab/rce/php.ini:
;   display_errors = On        (the stage-1 heap leak is rendered in a
;                               request-startup warning)
;   memory_limit   = 8M        (the OOM field is sized as memory_limit + 12M;
;                               the upstream default --huge-mb is 12)
;   post_max_size  = 512M      (the OOM body must not be rejected)
;   session.upload_progress.enabled = On
;   session.use_cookies = 1, session.use_strict_mode = 0
;
; Everything here is deliberate and documented. A production php.ini with
; display_errors=Off and memory_limit=128M does not run this chain unchanged;
; that is exactly what lab/php-hardened.ini demonstrates as a negative control.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
; log_errors must stay Off: the stage-1 Set-Cookie leak depends on the
; request-startup warning being flushed to the response (measured on the
; official image; see README.md).

memory_limit = 8M
post_max_size = 512M
upload_max_filesize = 512M
max_input_vars = 1000
max_file_uploads = 20

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On

; The official php:8.4.26-apache image loads these two shared extensions; the
; verified bookworm heap calibration was measured with them enabled.
extension_dir = "/usr/local/lib/php/extensions/no-debug-non-zts-20240924"
zend_extension = opcache.so
extension = sodium.so
