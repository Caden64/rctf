# M364 theming overlay for the OFFICIAL image guest.
#
# Installed as /etc/apache2/conf-enabled/zz-m364.conf. The image's own
# conf-enabled/docker-php.conf pins the directory index with
#   DirectoryIndex disabled
#   DirectoryIndex index.php index.html
# which keeps GET / on the allocation-inert /www/index.php and makes the
# themed static portal unreachable as / -- the landing page the event
# exposes (readiness GET / 200, shouldDisplay).
#
# mod_dir ACCUMULATES same-context DirectoryIndex directives (Apache docs,
# mod_dir "DirectoryIndex": multiple directives add to the list; to replace
# it you must explicitly reset it first with the `disabled` token -- the
# exact idiom docker-php.conf itself uses). A bare
#   DirectoryIndex index.html index.php
# would therefore only APPEND after docker-php's index.php and leave
# GET / on the inert page (measured: two full lab runs served `OK\n` at /
# before this reset was added).
#
# So this file resets the list and re-pins the order:
#
#   GET  /          -> /www/index.html   (themed, no PHP execution)
#   POST /index.php -> unchanged inert chain target (byte-identical page)
#
# Heap safety: the chain never requests a directory URL -- every exploit
# POST/GET addresses /index.php (and the runner probes /version.php and
# fetches /p) directly, so mod_dir is never on the chain's request path and
# the PHP allocator state the calibration depends on is untouched. /www
# /index.php itself stays byte-identical (`<?php echo "OK\n";`). The credit
# form therefore targets /index.php, not /: under this order a POST to /
# resolves to the static index.html (a 405) and never reaches PHP.
#
# Served only inside a disposable Firecracker microVM. See ../README.md
# ("Theming (M364 service-credit portal)").

DirectoryIndex disabled
DirectoryIndex index.html index.php
