# PHP2Shell training-lab Apache policy for the OFFICIAL image guest.
#
# Installed as /etc/apache2/conf-enabled/zz-php2shell.conf. The image's own
# apache2.conf, envvars, mods-enabled and docker-php.conf stay untouched, so
# the guest runs the exact Apache/PHP build the OCI digest pins. This file only
# reproduces the laboratory conditions the chain needs and that the toolkit's
# lab/rce/apache.conf sets:
#   * KeepAlive Off,
#   * exactly ONE prefork worker (the chain assumes one child).
#
# conf-enabled is included after mods-enabled, so these values override the
# image's mods-enabled/mpm_prefork.conf.
#
# Served only inside a disposable Firecracker microVM. See ../README.md.

KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
