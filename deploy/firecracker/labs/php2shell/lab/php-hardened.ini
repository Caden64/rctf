; PHP2Shell training-lab php.ini (HARDENED negative control).
;
; Identical to lab/php.ini except memory_limit, which is set above the
; 12 MiB OOM field the chain uses (--huge-mb 12, the upstream default). The
; pre-RINIT OOM therefore never fires and the chain cannot reach stage 1.
;
; This control proves that the lab's memory_limit is a laboratory condition,
; not something a default production PHP would satisfy. Do NOT pass
; --huge-mb 140 to "fix" this control: the point is to show the configured
; limit is load-bearing.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /tmp/php-errors.log

memory_limit = 128M
post_max_size = 512M
upload_max_filesize = 512M
max_input_vars = 1000
max_file_uploads = 20

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On

extension_dir = "/usr/local/lib/php/extensions/no-debug-non-zts-20240924"
zend_extension = opcache.so
extension = sodium.so
