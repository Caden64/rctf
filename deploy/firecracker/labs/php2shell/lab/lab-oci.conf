# PHP2Shell training-lab document root for the OFFICIAL image guest.
#
# Installed as /etc/apache2/conf-enabled/zz-lab.conf. The image's default
# <VirtualHost *:80> stays enabled but never matches the lab's :8080 listener,
# so these global directives serve every request:
#
#   DocumentRoot /www
#
# /www must exist before Apache starts (/app/start creates and chowns it).
# The SetHandler duplicates the image's docker-php.conf on purpose: the lab
# config is self-contained and does not depend on a2enconf state.
#
# The document root path and the landing page contents are heap-load-bearing:
# the stage-1 leak reclaims a freed 80-byte session-id block, and any PHP code
# that allocates on the POST path moves the allocator's free list enough to
# miss it. lab/www/index.php is therefore the toolkit's two-byte-output page,
# byte for byte. See RESULTS.md.

ServerName php2shell-lab
DocumentRoot /www

<Directory /www>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>
