; PHP2Shell training-lab php.ini (VULNERABLE laboratory condition), OFFICIAL
; image guest.
;
; Installed as /usr/local/etc/php/conf.d/zz-php2shell.ini. The official image
; ships no php.ini (only php.ini-production/-development examples), and that
; matters: with output_buffering=0 the max_input_vars warning is written to
; the response before headers are committed, which is what sets
; SG(headers_sent)=1 and leaves send_cookie=1 for the stage-1 leak. A stock
; php.ini-production here (output_buffering=4096) silently breaks stage 1.
;
; log_errors must stay OFF. Measured on the pinned image: adding
; `log_errors = On` (with error_log) makes the stage-1 Set-Cookie a normal
; 32-byte id instead of the 4096-byte OOB read, even though display_errors is
; still On. The startup warning's logging path changes when output is flushed.
; So this file deliberately mirrors the toolkit's verified lab/rce/php.ini and
; adds nothing else; max_input_vars=1000 and max_file_uploads=20 are PHP
; defaults and must not be changed.
;
; The image's own conf.d files keep loading opcache and sodium.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 512M
upload_max_filesize = 512M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
