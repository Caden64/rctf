# sshhole-yocto lab layer (CVE-2026-123158 on a genuine Yocto / poky rootfs).
#
# This layer only ADDS to the pinned poky (yocto-6.0.4, wrynose) metadata:
#   - one image recipe (core-image-minimal + openssh + lab config),
#   - one config recipe that installs /app/start,
#   - an openssh bbappend that swaps in the lab sshd_config.
# Everything else (openssh 10.3p1, musl/glibc, busybox, base-passwd, shadow
# tooling) comes from the stock, sha256-verified yocto-6.0.4 component tarballs.
# We deliberately do NOT pin a vulnerable openssh recipe: the stock
# yocto-6.0.4 recipe is openssh 10.3p1 and its backported patches
# (CVE-2026-59995/59996/59997/59999/60000/60001/60002) do not include
# CVE-2026-123158, so the stock build IS the vulnerable build.

BBPATH =. "${LAYERDIR}:"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sshhole"
BBFILE_PATTERN_sshhole = "^${LAYERDIR}/"
# Higher than oe-core (5) and meta-poky (5): our openssh_%.bbappend must win.
BBFILE_PRIORITY_sshhole = "10"

LAYERSERIES_COMPAT_sshhole = "wrynose"

LICENSE_PATH += "${LAYERDIR}/files/common-licenses"
